---
name: Lint Common Steps
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      runner:
        default: ubuntu-22.04
        description: 'The runner to execute this workfow with'
        required: false
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: 'Lint scripts & CI'
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.10'

      - name: Install ruff
        run: pip install ruff==0.14.5

      - name: Run ruff check on scripts
        run: ruff check scripts

      - name: Run ruff format on scripts
        run: ruff format scripts/

      - name: Install yamllint
        run: pip install yamllint==1.37.1

      - name: Run yamllint on workflows
        run: yamllint .github/workflows/
